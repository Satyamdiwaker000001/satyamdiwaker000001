name: Generate GitHub Stats Card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats + top languages card
        uses: lowlighter/metrics@latest
        with:
          filename: assets/stats-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: satyamdiwaker000001
          template: classic
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata
          config_output: svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg
          
          # Always fetch latest changes first
          git fetch origin main
          
          # Try to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats card"
          fi
          
          # Rebase and push - always ensure we have latest changes
          git rebase origin/main || git rebase --abort
          git push origin main
